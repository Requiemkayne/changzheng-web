<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>样例 B · CSS 立体桌面沙盘</title>
<link rel="stylesheet" href="/fonts/noto-serif-sc.css">
<style>
  :root {
    --red: #C8102E; --red-dark: #6E0918; --gold: #C6A343; --gold-light: #E8C86A;
    --paper: #F7F0DF; --ink: #35291F; --muted: #8C8475;
    --font-title: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --tiltX: 48deg; --tiltZ: -16deg;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #FDF7E8 0%, #F3E9D2 55%, #E4D7B9 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink); overflow: hidden;
  }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; padding: 14px 18px;
  }
  .title { font-family: var(--font-title); font-weight: 900; letter-spacing: 4px; color: var(--red-dark); font-size: 17px; }
  .title small { display: block; font-size: 11px; letter-spacing: 2px; color: var(--muted); font-weight: 400; margin-top: 4px; }
  .back { text-decoration: none; color: var(--red-dark); font-size: 12px; letter-spacing: 1px;
    border: 1px solid rgba(110,9,24,.25); background: rgba(255,253,247,.85); border-radius: 999px; padding: 6px 12px; }

  /* ---------- 3D 舞台 ---------- */
  .stage {
    position: fixed; inset: 0;
    perspective: 1500px;
    perspective-origin: 50% 42%;
  }
  .board {
    position: absolute; left: 50%; top: 50%;
    width: min(74vw, 660px); aspect-ratio: 3 / 4;
    transform: translate(-50%, -46%) rotateX(var(--tiltX)) rotateZ(var(--tiltZ));
    transform-style: preserve-3d;
    transition: transform .25s ease-out;
  }

  /* 纸面地图（顶层）+ 层叠投影（下层） */
  .map {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
  }
  .plane {
    position: absolute; inset: 0;
    border-radius: 18px;
    border: 1px solid rgba(198,163,67,.55);
  }
  .plane.top {
    background:
      linear-gradient(rgba(198,163,67,.07), rgba(198,163,67,.07)),
      repeating-linear-gradient(0deg, transparent 0 29px, rgba(198,163,67,.16) 29px 30px),
      repeating-linear-gradient(90deg, transparent 0 29px, rgba(198,163,67,.16) 29px 30px),
      #FBF4E2;
    transform: translateZ(0);
    box-shadow: 0 40px 70px -30px rgba(90,62,20,.45), inset 0 0 0 6px rgba(255,255,255,.5);
  }
  /* 层叠投影层：制造厚度感 */
  .plane.stack { background: #EFE3C6; }
  .plane.s1 { transform: translateZ(-10px); }
  .plane.s2 { transform: translateZ(-20px); }
  .plane.s3 { transform: translateZ(-30px); }
  .plane.s4 { transform: translateZ(-40px); }

  .route { position: absolute; inset: 0; transform: translateZ(2px); }

  /* ---------- 节点 ---------- */
  .pin { position: absolute; transform-style: preserve-3d; cursor: pointer; }
  .pin .shadow {
    position: absolute; left: 50%; top: 50%;
    width: 34px; height: 14px; margin: -7px 0 0 -17px;
    background: radial-gradient(ellipse at center, rgba(90,62,20,.34), rgba(90,62,20,0) 70%);
    transform: translateZ(0.5px);
  }
  .pin .stick {
    position: absolute; left: 50%; top: 50%;
    width: 2px; height: 44px; margin-left: -1px;
    background: linear-gradient(180deg, rgba(198,163,67,.15), rgba(198,163,67,.85));
    transform-origin: 50% 0;
    transform: translateZ(1px) rotateX(-90deg);
    transform-style: preserve-3d;
  }
  .pin .dot {
    position: absolute; left: 50%; top: 50%;
    width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%;
    transform: translateZ(44px);
    display: grid; place-items: center;
    font-family: var(--font-title); font-size: 12px; font-weight: 900;
    box-shadow: 0 6px 14px rgba(90,62,20,.35);
    transition: transform .2s ease-out, box-shadow .2s;
  }
  .pin:hover .dot { transform: translateZ(56px) scale(1.12); }
  .pin.active .dot { transform: translateZ(58px) scale(1.18); }
  .pin .tag {
    position: absolute; left: 50%; top: 50%;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    font-size: 12.5px; letter-spacing: .5px; color: var(--red-dark);
    background: rgba(255,252,244,.96); border: 1px solid rgba(198,163,67,.8);
    /* 反向旋转，让文字正对镜头 */
    transform: translate(-50%, -100%) translateZ(44px) rotateZ(16deg) rotateX(-48deg) translateY(-16px);
    transform-origin: 50% 100%;
    box-shadow: 0 6px 14px rgba(90,62,20,.18);
  }

  /* ---------- 底部信息 ---------- */
  .legend {
    position: fixed; left: 14px; bottom: 14px; z-index: 20;
    display: flex; gap: 12px; flex-wrap: wrap; max-width: 260px;
    background: rgba(255,253,247,.86); border: 1px solid rgba(198,163,67,.4);
    border-radius: 12px; padding: 9px 12px; font-size: 11px;
  }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  .info {
    position: fixed; right: 14px; bottom: 14px; z-index: 21; width: 230px;
    background: rgba(255,252,245,.95); border: 1px solid rgba(198,163,67,.55);
    border-radius: 14px; padding: 14px; display: none;
    box-shadow: 0 14px 34px rgba(90,62,20,.18);
  }
  .info.on { display: block; animation: pop .2s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } }
  .info-order { font-family: var(--font-title); font-size: 18px; font-weight: 900; color: var(--gold); margin-right: 8px; }
  .info-name { font-family: var(--font-title); font-size: 15px; font-weight: 900; color: var(--red-dark); letter-spacing: 2px; }
  .info-meta { font-size: 11px; color: var(--muted); margin-top: 7px; }
  .info-state { display: inline-block; margin-top: 10px; font-size: 10px; letter-spacing: 1px; border-radius: 999px; padding: 3px 10px; }

  .hint {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 20;
    font-size: 11px; color: var(--muted); background: rgba(255,253,247,.8);
    border: 1px solid rgba(198,163,67,.35); border-radius: 999px; padding: 6px 14px; white-space: nowrap;
  }
  @media (max-width: 560px) {
    .board { width: 86vw; }
    .title small { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">长征路线 · 立体沙盘<small>样例 B · 纯 CSS 3D（零依赖）</small></div>
  <a class="back" href="./index.html">← 返回样例列表</a>
</div>

<div class="stage">
  <div class="board" id="board">
    <div class="plane stack s4"></div>
    <div class="plane stack s3"></div>
    <div class="plane stack s2"></div>
    <div class="plane stack s1"></div>
    <div class="plane top"></div>
    <svg class="route" id="route" viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="rg" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#6E0918"/>
          <stop offset="0.6" stop-color="#C8102E"/>
          <stop offset="1" stop-color="#E8C86A"/>
        </linearGradient>
      </defs>
      <path id="routePath" fill="none" stroke="url(#rg)" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
      <path id="routeGold" fill="none" stroke="#E8C86A" stroke-width="1.6"
            stroke-linecap="round" stroke-dasharray="7 8" opacity=".85"/>
      <!-- 等高线（示意，只为沙盘质感） -->
      <g fill="none" stroke="rgba(140,132,117,.34)" stroke-width="1">
        <path d="M60,300 C80,270 130,262 150,286 C170,310 140,340 108,336 C76,332 48,322 60,300Z"/>
        <path d="M150,150 C170,120 210,116 228,142 C246,168 222,196 190,192 C158,188 138,176 150,150Z"/>
        <path d="M172,60 C190,42 220,46 232,66 C244,86 226,104 204,100 C182,96 160,78 172,60Z"/>
        <path d="M86,196 C96,182 116,182 122,196 C128,210 112,220 96,216 C80,212 78,208 86,196Z"/>
      </g>
    </svg>
    <div id="pins"></div>
  </div>
</div>

<div class="legend" id="legend"></div>
<div class="info" id="info"></div>
<div class="hint">移动鼠标看视角 · 点击节点查看</div>

<script src="./data.js"></script>
<script>
(function () {
  const nodes = window.CZ3D.nodes
  const STYLE = window.CZ3D.style
  const STATE_TEXT = window.CZ3D.stateText

  /* 经纬度 → 板面百分比坐标（等距投影 + 留边） */
  const LNG_MIN = 101.4, LNG_MAX = 117.2, LAT_MIN = 24.4, LAT_MAX = 36.8
  const PAD = 9   // 百分比留边
  const fx = lng => PAD + (lng - LNG_MIN) / (LNG_MAX - LNG_MIN) * (100 - PAD * 2)
  const fy = lat => PAD + (LAT_MAX - lat) / (LAT_MAX - LAT_MIN) * (100 - PAD * 2)

  const pos = nodes.map(n => ({ n, x: fx(n.lng), y: fy(n.lat) }))

  /* 路线（用 viewBox 0..300 / 0..400 换算百分比） */
  const VW = 300, VH = 400
  const px = x => x / 100 * VW, py = y => y / 100 * VH
  const d = pos.map((p, i) => (i ? 'L' : 'M') + px(p.x).toFixed(1) + ',' + py(p.y).toFixed(1)).join(' ')
  document.getElementById('routePath').setAttribute('d', d)
  document.getElementById('routeGold').setAttribute('d', d)

  /* 节点（DOM 层，带 3D 高度） */
  const pinsEl = document.getElementById('pins')
  pinsEl.innerHTML = pos.map((p, i) => {
    const st = STYLE[p.n.state]
    const textColor = (p.n.state === 'open' || p.n.state === 'quizPassed') ? st.label : st.label
    return '<div class="pin" data-i="' + i + '" style="left:' + p.x + '%;top:' + p.y + '%">' +
      '<span class="shadow"></span>' +
      '<span class="stick"></span>' +
      '<span class="dot" style="background:' + st.fill + ';color:' + textColor + ';border:1.5px solid ' + st.stroke + '">' + p.n.order + '</span>' +
      '<span class="tag">' + p.n.name + '</span>' +
    '</div>'
  }).join('')

  /* 图例 */
  document.getElementById('legend').innerHTML = ['quizPassed', 'checkedIn', 'open', 'locked'].map(k =>
    '<span><i style="background:' + STYLE[k].fill + ';box-shadow:0 0 0 1.5px ' + STYLE[k].stroke + ' inset"></i>' + STATE_TEXT[k] + '</span>'
  ).join('')

  /* 交互：点击节点 */
  const info = document.getElementById('info')
  pinsEl.addEventListener('click', e => {
    const pin = e.target.closest('.pin')
    if (!pin) return
    const p = pos[Number(pin.dataset.i)]
    document.querySelectorAll('.pin').forEach(el => el.classList.toggle('active', el === pin))
    const st = STYLE[p.n.state]
    info.innerHTML =
      '<div><span class="info-order">' + p.n.order + '</span><span class="info-name">' + p.n.name + '</span></div>' +
      '<div class="info-meta">' + p.n.date + ' · ' + p.n.place + '</div>' +
      '<span class="info-state" style="background:' + st.fill + ';color:' + st.label + '">' + STATE_TEXT[p.n.state] + '</span>'
    info.classList.add('on')
  })

  /* 视差：鼠标移动微调倾角 */
  const board = document.getElementById('board')
  let raf = null
  addEventListener('pointermove', e => {
    if (raf) return
    raf = requestAnimationFrame(() => {
      raf = null
      const nx = (e.clientX / innerWidth - 0.5)
      const ny = (e.clientY / innerHeight - 0.5)
      board.style.transform =
        'translate(-50%, -46%) rotateX(' + (48 - ny * 9) + 'deg) rotateZ(' + (-16 + nx * 9) + 'deg)'
    })
  })
})()
</script>
</body>
</html>
