  <!-- 1) 保留查询参数（?demo=1 / ?live=1），避免回主站被路由守卫弹到登录页；
        页内返回链同样带 data-keep-search，走同一段改写
       2) 已在专题站内点「青春经管」不再重载当页（同页只滚回顶部），跨页（系列页→总览）仍照常跳转 -->
  <script>
  (function () {
    var q = location.search
    var links = document.querySelectorAll('#tabbar a[href*="index.html"], a[data-keep-search]')
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href')
      var parts = href.split('#')
      if (q) links[i].setAttribute('href', parts[0] + q + (parts[1] ? '#' + parts[1] : ''))
    }
    // /dir/index.html 与 /dir/ 是同一页：按规范化后的路径判，避免凭写法差异漏判
    function samePage(href) {
      var norm = function (p) { return p.replace(/\/index\.html$/, '/') }
      try {
        return norm(new URL(href, location.href).pathname) === norm(location.pathname)
      } catch (e) {
        return false
      }
    }
    var self = document.querySelector('#tabbar .tab[aria-current="page"]')
    if (!self) return
    self.addEventListener('click', function (e) {
      if (!samePage(self.getAttribute('href'))) return
      e.preventDefault()
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' })
    })
  })()
  </script>
